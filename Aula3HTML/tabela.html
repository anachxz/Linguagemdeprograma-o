</thead>

</tbody>

        </tr>
        <tr>
            <td>Maria</td>
            <td>30</td>

        </tr>
        <tr>
            <td>3</td>
            <td>Pedro</td>
            <td>28</td>
            <td>Belo Horizonte</td>
        </tr>
        <tr>
            <td colspan="3">Total</td>
            <td>50</td>
          
        </tr>

</tbody>

    </table>
